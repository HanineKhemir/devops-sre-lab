# Control-plane components are not reachable on kind; skip their scrapes.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 7d
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Pick up PrometheusRule / ServiceMonitor objects from any release.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }
    # Scrape any pod annotated prometheus.io/scrape: "true".
    additionalScrapeConfigs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: Pending|Succeeded|Failed|Completed
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app

alertmanager:
  service:
    type: NodePort
    nodePort: 30093
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/<name>/<key>
    secrets: [alertmanager-receivers]
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, slo]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: pager
          matchers: ['severity = "critical"', 'slo =~ ".+"']
          group_wait: 10s
          repeat_interval: 1h
        - receiver: slack
          matchers: ['severity = "warning"', 'slo =~ ".+"']
    receivers:
      - name: "null"
      - name: pager
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-receivers/pager_url
            send_resolved: true
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack_url
            channel: "#sre-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }} {{ end }}'
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: [slo]

grafana:
  service:
    type: NodePort
    nodePort: 30300
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc:3100
      jsonData:
        derivedFields:
          - name: TraceID
            matcherType: regex
            matcherRegex: '"trace_id":\s*"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
            urlDisplayLabel: View trace in Tempo
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: true
          customQuery: true
          query: '{namespace="catalog"} |= "$${__trace.traceId}"'
        tracesToMetrics:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki
