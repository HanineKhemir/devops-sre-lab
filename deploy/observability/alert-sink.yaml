# Local stand-in for PagerDuty / Slack: logs every Alertmanager notification
# it receives, so routing (critical -> /pager, warning -> /slack) is visible
# with `kubectl -n monitoring logs deploy/alert-sink`.
# To use real Slack, put the webhook URL in the alertmanager-receivers secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-sink
  namespace: monitoring
data:
  sink.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
            try:
                payload = json.loads(body)
            except ValueError:
                payload = {"raw": body.decode(errors="replace")}
            alerts = payload.get("alerts") or []
            summary = [
                {"status": a.get("status"), **a.get("labels", {})} for a in alerts
            ] or payload
            print(json.dumps({"channel": self.path, "alerts": summary}), flush=True)
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-sink }
  template:
    metadata:
      labels: { app: alert-sink }
    spec:
      containers:
        - name: sink
          image: python:3.12-slim
          command: ["python", "-u", "/app/sink.py"]
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts: [{ name: code, mountPath: /app }]
      volumes:
        - name: code
          configMap: { name: alert-sink }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  selector: { app: alert-sink }
  ports: [{ port: 8080, targetPort: 8080 }]
