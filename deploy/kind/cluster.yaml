kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 30080, protocol: TCP }  # catalog-api
      - { containerPort: 30300, hostPort: 30300, protocol: TCP }  # grafana
      - { containerPort: 30090, hostPort: 30090, protocol: TCP }  # prometheus
      - { containerPort: 30093, hostPort: 30093, protocol: TCP }  # alertmanager
      - { containerPort: 30443, hostPort: 30443, protocol: TCP }  # argocd
