apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalog.name" . }}
  labels: {{- include "catalog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "catalog.selector" . | nindent 6 }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "catalog.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: OTEL_SERVICE_NAME, value: catalog-api }
            - { name: SERVICE_VERSION, value: {{ .Values.image.tag | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.app.otlpEndpoint | quote }} }
            - { name: FLAKY_ERROR_RATE, value: {{ .Values.app.flakyErrorRate | quote }} }
            - { name: CHECKOUT_DELAY_MIN_MS, value: {{ .Values.app.checkoutDelayMinMs | quote }} }
            - { name: CHECKOUT_DELAY_MAX_MS, value: {{ .Values.app.checkoutDelayMaxMs | quote }} }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
