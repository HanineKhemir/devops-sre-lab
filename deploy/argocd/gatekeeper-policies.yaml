# Policies are versioned in Git and synced like any other workload.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HanineKhemir/devops-sre-lab.git
    targetRevision: main
    path: policies
    directory:
      include: "{templates/*.yaml,constraints/*.yaml}"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - SkipDryRunOnMissingResource=true
