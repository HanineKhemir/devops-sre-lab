name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "deploy/helm/catalog-api/values.yaml"   # GitOps bumps made by this workflow
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/catalog-api
  TRIVY_VERSION: "0.76.2"

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest (coverage >= 85 %)
        run: pytest
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.lcov

  sonar:
    name: SonarQube Analysis & Quality Gate
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for new-code detection and blame
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: SonarCloud scan (blocks on red Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Enforce lab thresholds on new code
        # Belt and braces: fails even if the server-side gate is the default
        # "Sonar way" (free plans cannot always customise it).
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_quality_gate.py

  build-scan-push:
    name: Build, Trivy scan, Push
    needs: sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (CRITICAL = fail)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" aquasec/trivy:${TRIVY_VERSION} image \
            --severity CRITICAL --exit-code 1 --no-progress \
            ${IMAGE}:${{ steps.meta.outputs.tag }}
      - name: Trivy SARIF report (all severities, informational)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" aquasec/trivy:${TRIVY_VERSION} image \
            --format sarif --output /out/trivy.sarif --no-progress \
            ${IMAGE}:${{ steps.meta.outputs.tag }}
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ${IMAGE}:${{ steps.meta.outputs.tag }}

  gitops-bump:
    name: GitOps — bump image tag
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update Helm values (ArgoCD syncs the change)
        env:
          TAG: ${{ needs.build-scan-push.outputs.tag }}
        run: |
          sed -i -E "s|^(  tag: ).*|\1\"${TAG}\"|" deploy/helm/catalog-api/values.yaml
          git diff --exit-code && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: catalog-api ${TAG} [skip ci]"
          git push
