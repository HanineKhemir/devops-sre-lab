apiVersion: apps/v1
kind: Deployment
metadata: { name: bad-no-resources, namespace: catalog }
spec:
  replicas: 1
  selector: { matchLabels: { app: bad-no-resources } }
  template:
    metadata: { labels: { app: bad-no-resources } }
    spec:
      containers:
        - name: app
          image: nginx:1.27.3

