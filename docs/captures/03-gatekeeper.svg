<text x="16" y="96" fill="#e6edf3">k8sdisallowlatesttag   25m</text>
<text x="16" y="114" fill="#e6edf3">k8srequiredresources   25m</text>
<text x="16" y="132" fill="#e6edf3"></text>
<text x="16" y="150" fill="#7ee787">$ kubectl get constraints</text>
<text x="16" y="168" fill="#e6edf3">NAME                                                                 ENFORCEMENT-ACTION   TOTAL-VIOLATIONS</text>
<text x="16" y="186" fill="#e6edf3">k8sdisallowlatesttag.constraints.gatekeeper.sh/disallow-latest-tag   deny                 0</text>
<text x="16" y="204" fill="#e6edf3"></text>
