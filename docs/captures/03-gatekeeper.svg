<text x="487.5" y="20" fill="#8b949e" font-family="Menlo,monospace" font-size="12" text-anchor="middle">kubectl — OPA Gatekeeper admission</text>
<g font-family="Menlo,Consolas,monospace" font-size="13" xml:space="preserve" style="white-space:pre">
<text x="16" y="60" fill="#7ee787">$ kubectl get constrainttemplates</text>
