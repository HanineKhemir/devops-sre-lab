[project]
name = "catalog-api"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=lcov:coverage.lcov --cov-fail-under=85"

[tool.coverage.run]
relative_files = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "I001"]
